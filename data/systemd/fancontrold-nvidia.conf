# Installed as a drop-in only on machines that have an NVIDIA GPU.
#
# NVML refuses to initialise inside the sandbox the main unit sets up. It
# returns NVML_ERROR_NO_PERMISSION from nvmlInit_v2 even though the daemon runs
# as root, so what it is missing is access rather than privilege. These three
# settings are the ones that can plausibly keep it from reaching the driver,
# the empty capability bounding set most of all: with it, a root process holds
# no capabilities at all.
#
# Everything else the main unit sets stays in force, and a machine without an
# NVIDIA GPU never gets this file.
[Service]
# ~ with nothing after it means "all but none", i.e. the full set. An empty
# assignment would mean the opposite.
CapabilityBoundingSet=~
SystemCallFilter=
PrivateTmp=no
