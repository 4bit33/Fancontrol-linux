# Installed as a drop-in only on machines that have an NVIDIA GPU.
#
# The unit drops every capability, which a daemon driving board fans does not
# need: writing a PWM file is an ordinary write that root may do anyway. The
# NVIDIA driver is different. It refuses nvmlDeviceSetFanSpeed_v2 with "no
# permission" when the process holds no capabilities, even as root, so the
# daemon could read the GPU's temperature and never change its fans.
#
# This was measured rather than reasoned about, by running the same NVML calls
# under each of the unit's settings on its own (tools/nvidia-diagnose.sh). Of
# the twelve, this is the only one that breaks fan control - every other
# protection the unit applies stays in force, including ProtectSystem=strict,
# PrivateTmp and the system call filter.
#
# Which single capability the driver actually wants is still unknown: the two
# that looked most likely, CAP_SYS_ADMIN and CAP_DAC_OVERRIDE, were not enough
# even to start NVML. Run the diagnose tool again to narrow it further.
[Service]
# "~" with nothing after it means "all but none", i.e. every capability.
CapabilityBoundingSet=~
