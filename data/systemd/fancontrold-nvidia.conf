# Installed as a drop-in only on machines that have an NVIDIA GPU.
#
# NVML will not start inside the sandbox the main unit sets up, returning
# NVML_ERROR_NO_PERMISSION from nvmlInit_v2 even though the daemon runs as
# root. These two are what it needs relaxed; the capability set is dealt with
# in the main unit, because a positive list is needed there whether or not
# there is a GPU.
#
# Everything else the main unit sets stays in force, and a machine without an
# NVIDIA GPU never gets this file.
[Service]
# An empty assignment resets the filter, so no system call is blocked.
SystemCallFilter=
PrivateTmp=no
