# Installed as a drop-in only on machines that have an NVIDIA GPU.
#
# The unit drops every capability, which a daemon driving board fans does not
# need. The NVIDIA driver refuses nvmlDeviceSetFanSpeed_v2 with "no permission"
# when the process holds none, even as root, so this puts them back. Measured
# with tools/nvidia-diagnose.sh: of the unit's settings, this is the only one
# that stops fan control, so every other protection stays in force.
#
# NVML failing to start at all is a different problem, and was SELinux rather
# than the sandbox - see the ExecStart comment in fancontrold.service.
[Service]
# "~" with nothing after it means "all but none", i.e. every capability.
CapabilityBoundingSet=~
