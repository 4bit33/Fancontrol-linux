# Installed as a drop-in only on machines that have an NVIDIA GPU.
#
# The NVIDIA driver will not let a process in this sandbox drive a fan. Which
# part of it is responsible has not been established: an empty capability set
# stops NVML starting at all, and putting capabilities back left it able to
# read the GPU but still refused every attempt to set a speed, with
# NVML_ERROR_OPERATING_SYSTEM. Narrowing it by reasoning has been tried three
# times and been wrong three times.
#
# So this reproduces the one configuration that is known to work: the same NVML
# calls succeed for plain root with no sandbox at all. It is deliberately
# broad, and meant to be narrowed once tools/nvidia-diagnose.sh has said which
# setting is actually to blame rather than which one seems likely.
#
# A machine without an NVIDIA GPU never gets this file and keeps the strict
# unit, which is the common case.
[Service]
# "~" with nothing after it means "all but none", i.e. every capability.
CapabilityBoundingSet=~
# An empty assignment resets the list, so no system call is blocked.
SystemCallFilter=
SystemCallArchitectures=
NoNewPrivileges=no
PrivateTmp=no
ProtectHome=no
ProtectSystem=no
ProtectControlGroups=no
RestrictNamespaces=no
RestrictRealtime=no
RestrictSUIDSGID=no
LockPersonality=no
