<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Who may talk to the fan control daemon.

  Reading is open to every local user, so a status applet or a plain 'fanctl
  status' works without privileges. Anything that changes how the fans are
  driven is restricted to the group that already grants administrative rights:
  wheel on Fedora, Arch and openSUSE, sudo on Debian and Ubuntu, admin on older
  Ubuntu releases.

  install.sh removes the blocks for groups that do not exist on the machine,
  so the installed file names only real ones. To let another group configure
  the fans, copy a block and change the group name.
-->
<busconfig>
  <policy user="root">
    <allow own="org.fancontrol.Daemon"/>
    <allow send_destination="org.fancontrol.Daemon"/>
  </policy>

  <policy context="default">
    <allow send_destination="org.fancontrol.Daemon"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.fancontrol.Daemon"
           send_interface="org.freedesktop.DBus.Properties"/>

    <allow send_destination="org.fancontrol.Daemon"
           send_interface="org.fancontrol.Daemon1" send_member="GetVersion"/>
    <allow send_destination="org.fancontrol.Daemon"
           send_interface="org.fancontrol.Daemon1" send_member="GetStatus"/>
    <allow send_destination="org.fancontrol.Daemon"
           send_interface="org.fancontrol.Daemon1" send_member="GetConfig"/>
    <allow send_destination="org.fancontrol.Daemon"
           send_interface="org.fancontrol.Daemon1" send_member="GetInventory"/>
  </policy>

  <policy group="wheel">
    <allow send_destination="org.fancontrol.Daemon"
           send_interface="org.fancontrol.Daemon1"/>
  </policy>
  <policy group="sudo">
    <allow send_destination="org.fancontrol.Daemon"
           send_interface="org.fancontrol.Daemon1"/>
  </policy>
  <policy group="admin">
    <allow send_destination="org.fancontrol.Daemon"
           send_interface="org.fancontrol.Daemon1"/>
  </policy>
</busconfig>
